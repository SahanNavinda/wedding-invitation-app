<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Invitation</title>
<link rel="stylesheet" href="assets/css/kandyan.css">
<header><div class="cover">
<div class="ornament" aria-hidden="true">&#10086;</div>
<p class="eyebrow">Sri Suba Mangalam</p>
<p>The wedding of</p>
<h1 data-names></h1>
<p data-date></p>
<p id="guest" hidden></p>
<a class="button" href="#invitation">Open Invitation</a>
</div></header>
<main id="invitation">
<section data-section="intro"><p class="eyebrow">Together with our families</p><h2 data-names></h2><p id="welcome"></p><p data-date></p></section>
<section data-section="countdown"><p class="eyebrow">The big day awaits</p><h2>Counting Down</h2><p id="countdown"></p></section>
<section data-section="events"><h2>Wedding Events</h2><div class="cards" id="events"></div></section>
<section data-section="venue"><p class="eyebrow">Wedding venue</p><h2 id="venue"></h2><a class="button" id="map">View on Map</a></section>
<section data-section="rsvp"><h2>Will You Join Us?</h2><p id="deadline"></p><a class="button" id="rsvp" hidden>RSVP on WhatsApp</a><form id="demo-rsvp"><label>Your name <input name="guest" required></label> <label>Attendance <select name="attendance"><option>Joyfully accept</option><option>Regretfully decline</option></select></label> <button class="button">Try RSVP</button></form><p id="demo-status" role="status">Sample invitation. Replies are simulated.</p></section>
<section data-section="story" id="story" hidden><h2>Our Story</h2><p id="story-text"></p></section></main><footer><a href="index.html">Browse wedding samples</a></footer>
<script src="assets/js/kandyan.js"></script>
</html>
